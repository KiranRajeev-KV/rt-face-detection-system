services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-face_stream}
      POSTGRES_USER: ${POSTGRES_USER:-face_stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-face_stream}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_stream} -d ${POSTGRES_DB:-face_stream}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://face_stream:face_stream@postgres:5432/face_stream}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-["http://localhost:5173"]}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env.example
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data:
